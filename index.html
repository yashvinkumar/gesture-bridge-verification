<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gesture Bridge - Email Verified</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #2563EB,
                #14B8A6
            );
        }

        .card {

            width: 90%;
            max-width: 430px;

            background: white;

            border-radius: 28px;

            padding: 40px 30px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.2);
        }

        .icon {

            width: 90px;
            height: 90px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #DCFCE7;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 48px;

            color: #16A34A;
        }

        h1 {

            margin-bottom: 12px;

            color: #1F2937;

            font-size: 28px;
        }

        p {

            color: #6B7280;

            font-size: 16px;

            line-height: 1.6;
        }

        .button {

            display: inline-block;

            margin-top: 25px;

            padding: 15px 30px;

            background: #2563EB;

            color: white;

            text-decoration: none;

            border-radius: 30px;

            font-size: 16px;

            font-weight: bold;
        }

        .button:hover {

            background: #1D4ED8;
        }

    </style>

</head>


<body>

    <div class="card">

        <div class="icon">
            ✓
        </div>

        <h1>
            Email Verified Successfully!
        </h1>

        <p>
            Your Gesture Bridge account has
            been verified successfully.
        </p>

        <p>
            You can now return to the Gesture
            Bridge application and log in.
        </p>

        <a
            class="button"
            href="#"
            onclick="window.close(); return false;"
        >
            Return to Gesture Bridge
        </a>

    </div>

</body>

</html>
